name: Weekly link check
on:
  schedule:
    - cron: "17 11 * * 0"   # Sundays, about 6-7 AM Eastern
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429,999 --exclude formspree.io --root-dir "${{ github.workspace }}" './**/*.html'
          fail: false
      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found (weekly check)
          content-filepath: ./lychee/out.md
